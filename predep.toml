# predep.toml — stage manifest for holdfast
#
# Replaces CMake. The build itself is described in premake5.lua and driven by
# the `build` stage below via predep's premake5 integration (premake5 gmake +
# make). No vendored C++ dependencies, so there is no vendor stage.
#
# Usage (predep resolves stages in dependency order):
#   predep            # build the holdfast binary            -> bin/holdfast
#   predep check      # build + run the unit tests
#   predep e2e        # real-bwrap smoke test (non-root, needs userns)
#   predep install    # install binary + example profiles + docs
#   predep clean      # remove build artifacts
#
# "Zero warnings is the bar": -Werror is ON by default (see premake5.lua).
# To relax it (e.g. for a quick local build):   HOLDFAST_WERROR=OFF predep
# This mirrors the previous `cmake -DHOLDFAST_WERROR=ON` default.

main = "build"
project = "holdfast"

[[stages]]
name = "build"
description = "Build holdfast with premake5 (native)"
type = "premake5"
config = "release"
outputs = ["root://bin/holdfast"]
clean = true
clean_paths = ["root://obj"]

